[package]
name = "signet"
version = "0.1.0"
description = "Screenshots that live on the notch."
build = "build.rs"
edition = "2024"

[dependencies]
gif = "0.14"
png = "0.18"
regex-lite = "0.1"
pdf-writer = "0.15"
rusqlite = { version = "0.43", features = ["bundled"] }
windows-numerics = "0.3"

[dependencies.windows]
version = "0.62"
features = [
  "Foundation", "Foundation_Collections", "Foundation_Numerics",
  "Globalization", "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11",
  "Graphics_Imaging", "Media_Ocr", "Storage_Streams",
  "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectComposition",
  "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange",
  "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance",
  "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading",
  "Win32_Media_MediaFoundation", "Win32_System_Variant", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
  "Win32_System_ProcessStatus", "Win32_UI_Accessibility",
  "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
  "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
