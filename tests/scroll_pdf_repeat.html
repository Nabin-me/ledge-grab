<!doctype html><html lang="en"><meta charset="utf-8"><title>Ledge Grab Scroll to PDF uncertain seam test</title>
<!-- Every message is identical, so no scroll step has one clear overlap. Scroll to PDF
     must stop and label the PDF partial rather than guess a seam. -->
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#202a33;font:16px/1.45 system-ui}main{max-width:760px;margin:68px auto 0;padding:0 20px}h1{margin:0 0 6px;font-size:25px}p{margin:0 0 12px}#pane{margin-top:12px;height:min(52vh,460px);min-height:265px;max-height:460px;overflow-y:scroll;border:1px solid #9fa;background:#fcfcfc;scroll-behavior:auto}article{margin:12px 24px;padding:9px 15px;border:1px solid #cdd9e3;border-radius:7px;background:#e9f0f7}strong{display:block}
</style>
<main><h1>Uncertain seam fixture</h1><p>All rows repeat. Capture the pane only.</p>
<div id="pane" tabindex="0" aria-label="Repeating conversation"></div></main>
<script>
const pane = document.querySelector('#pane');
for (let n = 0; n < 60; n++) {
  const a = document.createElement('article'), t = document.createElement('strong'), b = document.createElement('span');
  t.textContent = 'SAME MESSAGE'; b.textContent = 'This row is identical to every other row.';
  a.append(t, b); pane.append(a);
}
</script></html>
