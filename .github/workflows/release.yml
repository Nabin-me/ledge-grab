name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test

      - name: Build Windows installer, portable ZIP & standalone EXE
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y
          }
          .\packaging\build-release.ps1

      - name: Upload unsigned Windows artifacts
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-unsigned
          path: |
            dist/*-win-x64.exe
            dist/*-Setup-*-x64.exe
            dist/*-portable.zip
            dist/SHA256SUMS.txt

      # -----------------------------------------------------------------------
      # Free publicly trusted Windows code signing via SignPath Foundation
      # (https://signpath.org — 100% free for OSI open-source GitHub repos).
      # Automatically activates once you configure:
      #   Repo Variable: SIGNPATH_ORGANIZATION_ID
      #   Repo Variable: SIGNPATH_PROJECT_SLUG
      #   Repo Secret:   SIGNPATH_API_TOKEN
      # -----------------------------------------------------------------------
      - name: Sign Windows binaries via SignPath Foundation (Free OSS)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-dist

      - name: Recompute SHA256SUMS for signed artifacts
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' }}
        shell: pwsh
        run: |
          $files = Get-ChildItem signed-dist -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name
          $files | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($_.Name)"
          } | Set-Content -Path signed-dist\SHA256SUMS.txt -Encoding UTF8

      # Installed copies only install a release whose manifest verifies against the
      # public key in src/update.rs. Fails the release if the key secret is missing.
      - name: Sign the auto-update manifest
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          python -m pip install --quiet cryptography
          $dir = if (Test-Path signed-dist) { 'signed-dist' } else { 'dist' }
          $version = ([regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"')).Groups[1].Value
          python packaging/update-manifest.py sign $dir $version
          if ($LASTEXITCODE -ne 0) { throw "update manifest signing failed" }

      - name: Upload final release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && 'signed-dist/*' || 'dist/*' }}

  publish-release:
    name: Publish GitHub Release
    needs: [windows-x64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ### Downloads (Windows x64)
            - **`LedgeGrab-Setup-*-x64.exe`** — Standard Windows installer (per-user by default, clean uninstaller via Windows Settings → Apps)
            - **`LedgeGrab-*-win-x64-portable.zip`** — Portable zero-install archive
            - **`LedgeGrab-*-win-x64.exe`** — Single standalone executable
            - **`SHA256SUMS.txt`** — SHA-256 verification checksums
            - **`ledge-grab-update.txt`** — signed manifest that installed copies use to update themselves

            ### Verification
            Verify downloads against `SHA256SUMS.txt`. All binaries are built directly from source via GitHub Actions. If Windows SmartScreen warns on first launch, click **More info → Run anyway** (or build from source with `cargo build --release`).
